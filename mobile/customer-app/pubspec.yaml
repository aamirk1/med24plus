name: med24plus
description: "Med24Plus Online Pharmacy Mobile Application"
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Networking & Navigation
  dio: ^5.7.0
  go_router: ^14.6.2

  # Secure Storage & Images
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1

  # Firebase Cloud Messaging, Phone Authentication & Cloud Storage
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  firebase_auth: ^5.5.0
  firebase_storage: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

