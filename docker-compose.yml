services:
  postgres:
    image: postgres:16-alpine
    container_name: med24plus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmacy_secure_dev_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-med24plus_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmacy_user} -d ${POSTGRES_DB:-med24plus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmacy_network

  redis:
    image: redis:7-alpine
    container_name: med24plus_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_dev_secret_2026}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmacy_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: med24plus_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - PROJECT_NAME=Med24Plus
      - API_V1_STR=/api/v1
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-pharmacy_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pharmacy_secure_dev_pass_2026}
      - POSTGRES_DB=${POSTGRES_DB:-med24plus_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pharmacy_user}:${POSTGRES_PASSWORD:-pharmacy_secure_dev_pass_2026}@postgres:5432/${POSTGRES_DB:-med24plus_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_secret_2026}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_super_secret_jwt_key_at_least_32_chars_long}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3001","http://127.0.0.1:3000","http://127.0.0.1:3001"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pharmacy_network

volumes:
  postgres_data:
    name: med24plus_postgres_data
  redis_data:
    name: med24plus_redis_data

networks:
  pharmacy_network:
    name: med24plus_network
    driver: bridge

