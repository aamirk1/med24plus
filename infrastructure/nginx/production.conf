# ==============================================================================
# Med24Plus Production Nginx Configuration
# Subdomains:
#   - med24plus.serwex.in       -> Customer Web (Port 3024)
#   - med24plus-admin.serwex.in -> Admin Panel  (Port 3025)
#   - med24plus-api.serwex.in   -> FastAPI API  (Port 8024)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FastAPI Backend API (med24plus-api.serwex.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name med24plus-api.serwex.in;

    # Allow up to 25MB for multipart prescription & batch document uploads
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8024;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer database queries / report downloads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. Customer Web Application (med24plus.serwex.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name med24plus.serwex.in;

    client_max_body_size 25M;

    # Gzip Compression for Next.js static chunks
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3024;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # Cache Next.js static immutable assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3024;
        proxy_cache_valid 200 365d;
        access_log off;
    }
}

# ------------------------------------------------------------------------------
# 3. Pharmacy Admin Panel (med24plus-admin.serwex.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name med24plus-admin.serwex.in;

    client_max_body_size 25M;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3025;
        proxy_cache_valid 200 365d;
        access_log off;
    }
}
